[project]
name = "hexlet-code"
version = "0.1.0"
description = "Brain Games"
readme = "README.md"
authors = [
    { name = "Ruslan Atpaev", email = "rus16.steam@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "prompt>=0.4.1",
]

[project.scripts]
brain-games = "brain_games.scripts.brain_games:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain_games"]
